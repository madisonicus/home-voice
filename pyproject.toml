[project]
name = "homevoice"
version = "0.1.0"
description = "Security-first local voice assistant: a deterministic action broker between the model and the house."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.2"]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
